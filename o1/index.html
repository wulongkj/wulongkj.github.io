<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="极简导航搜索 - 输入关键词，从全站数据中快速找到目标网站。">
<title>极简导航 · 搜索</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%236678e6"/><stop offset="1" stop-color="%23a855f7"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(%23g)"/><path d="M26 20l14 12-14 12z" fill="white"/></svg>'>
<style>
:root {
  --bg-0: #0b1020;
  --bg-1: #141a3a;
  --bg-2: #251d4f;
  --ink: #eef1ff;
  --ink-dim: #9aa3c7;
  --accent: #818cf8;
  --accent-2: #38bdf8;
  --glass: rgba(255, 255, 255, 0.06);
  --glass-border: rgba(255, 255, 255, 0.12);
  --radius: 18px;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { color-scheme: dark; }
body {
  min-height: 100vh;
  font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  color: var(--ink);
  background: linear-gradient(160deg, var(--bg-0), var(--bg-1) 55%, var(--bg-2));
  overflow-x: hidden;
}
/* ---- 背景装饰 ---- */
.decor { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
.decor::before, .decor::after, .decor i {
  content: ""; position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55;
}
.decor::before { width: 520px; height: 520px; left: -140px; top: -160px; background: #4f46e5; }
.decor::after { width: 460px; height: 460px; right: -120px; bottom: -140px; background: #7c3aed; }
.decor i { width: 320px; height: 320px; left: 50%; top: 55%; background: #0ea5e9; opacity: 0.28; }
.decor .dot { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.16); filter: none; animation: float 7s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }

/* ---- 主容器 ---- */
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

/* ---- 顶部品牌条 ---- */
.bar {
  display: flex; align-items: center; gap: 12px; padding: 22px 0 0;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.bar .mini-logo { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 20px; background: linear-gradient(135deg, var(--accent), #a855f7); box-shadow: 0 8px 24px rgba(99,102,241,.4); }
.bar .site-name { font-size: 20px; font-weight: 700; letter-spacing: .5px; }

/* ---- Hero 空态区 ---- */
.hero {
  min-height: 58vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
  padding: 48px 0 56px; transition: min-height 0.4s ease, padding 0.4s ease;
}
.brand { text-align: center; transition: opacity 0.35s ease, transform 0.35s ease; }
.brand .logo {
  width: 74px; height: 74px; margin: 0 auto 22px; border-radius: 22px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), #a855f7); box-shadow: 0 18px 44px rgba(99,102,241,.45);
}
.brand h1 {
  font-size: 42px; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(90deg, #c7d2fe, #ffffff 55%, #7dd3fc);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.brand p { margin-top: 12px; color: var(--ink-dim); font-size: 15px; letter-spacing: 1px; }

/* ---- 搜索框 ---- */
.searchbox {
  margin-top: 40px; width: min(620px, 100%); position: relative; transition: width 0.4s ease;
}
.searchbox input {
  width: 100%; height: 58px; padding: 0 52px 0 52px; border-radius: 999px; border: 1px solid var(--glass-border);
  background: rgba(15, 20, 45, 0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  color: var(--ink); font-size: 16px; outline: none; transition: border-color .25s, box-shadow .25s;
}
.searchbox input::placeholder { color: var(--ink-dim); }
.searchbox input:focus { border-color: rgba(129,140,248,.7); box-shadow: 0 0 0 4px rgba(99,102,241,.18), var(--shadow); }
.searchbox .mag { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--ink-dim); pointer-events: none; }
.searchbox .clear {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border: none;
  border-radius: 50%; background: transparent; color: var(--ink-dim); cursor: pointer; display: none; align-items: center; justify-content: center;
}
.searchbox .clear:hover { background: rgba(255,255,255,.1); color: var(--ink); }

/* 热门关键词 */
.hints { margin-top: 22px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; transition: opacity .35s, transform .35s; }
.hints span { font-size: 13px; color: var(--ink-dim); padding: 6px 8px; }
.hints button {
  font-size: 13px; color: #c7d2fe; padding: 6px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--glass-border); background: var(--glass); transition: all .2s;
}
.hints button:hover { border-color: var(--accent); color: #fff; background: rgba(99,102,241,.18); }

/* ---- 搜索态收缩 ---- */
body.searching .hero { min-height: 0; padding: 20px 0 8px; }
body.searching .brand { opacity: 0; transform: translateY(-14px) scale(.96); pointer-events: none; height: 0; overflow: hidden; margin: 0; }
body.searching .hints { opacity: 0; transform: translateY(-10px); pointer-events: none; height: 0; margin: 0; overflow: hidden; }
body.searching .searchbox { width: min(760px, 100%); margin-top: 0; }

/* ---- 结果区 ---- */
.results { padding: 26px 0 60px; opacity: 0; transform: translateY(12px); transition: opacity .35s ease, transform .35s ease; }
body.searching .results { opacity: 1; transform: none; }
.result-meta { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; font-size: 14px; color: var(--ink-dim); }
.result-meta b { color: var(--ink); font-weight: 600; }
.result-meta .query { color: var(--accent); }

/* ---- 网格 ---- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); gap: 16px; }

/* 骨架屏卡片 */
.skel-card {
  height: 118px; border-radius: var(--radius); border: 1px solid var(--glass-border);
  background: var(--glass); display: flex; align-items: center; gap: 16px; padding: 20px; overflow: hidden;
}
.skel-card .ic { width: 52px; height: 52px; border-radius: 14px; flex: none; }
.skel-card .ln { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.skel-card .ln i { height: 12px; border-radius: 6px; }
.skel-card .ln i:first-child { width: 62%; }
.skel-card .ln i:last-child { width: 88%; }
.shimmer { background: linear-gradient(90deg, rgba(255,255,255,.05) 25%, rgba(255,255,255,.14) 37%, rgba(255,255,255,.05) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

/* 结果卡片 */
.card {
  position: relative; display: flex; align-items: center; gap: 15px; padding: 20px; border-radius: var(--radius);
  border: 1px solid var(--glass-border); background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  text-decoration: none; color: var(--ink); transition: transform .22s ease, border-color .22s ease, background .22s ease;
  animation: pop .3s ease both;
}
.card:hover { transform: translateY(-4px); border-color: rgba(129,140,248,.55); background: rgba(99,102,241,.12); }
@keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.card .fav {
  width: 52px; height: 52px; border-radius: 14px; flex: none; display: grid; place-items: center;
  color: #fff; font-size: 21px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.card .body { min-width: 0; }
.card .name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .desc { margin-top: 5px; font-size: 12.5px; color: var(--ink-dim); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.card .tags { margin-top: 9px; display: flex; gap: 6px; flex-wrap: wrap; }
.card .tags em {
  font-style: normal; font-size: 11px; color: #c7d2fe; padding: 2px 8px; border-radius: 999px;
  background: rgba(129,140,248,.14); border: 1px solid rgba(129,140,248,.22);
}
.card .arrow { position: absolute; right: 16px; top: 16px; color: var(--ink-dim); opacity: 0; transition: opacity .2s, color .2s; }
.card:hover .arrow { opacity: 1; color: var(--accent); }

/* 空结果 */
.none { padding: 60px 0; text-align: center; color: var(--ink-dim); }
.none svg { width: 56px; height: 56px; opacity: .6; }
.none p { margin-top: 14px; font-size: 15px; }

/* 页脚 */
footer { padding: 30px 0 34px; text-align: center; color: rgba(154,163,199,.55); font-size: 12.5px; letter-spacing: .5px; }
footer a { color: rgba(154,163,199,.7); text-decoration: none; }
footer a:hover { color: var(--accent); }

/* 响应式 */
@media (max-width: 640px) {
  .brand h1 { font-size: 32px; }
  .hero { min-height: 62vh; }
  .grid { grid-template-columns: 1fr; }
  .searchbox input { height: 52px; font-size: 15px; }
}
</style>
</head>
<body>

<div class="decor" aria-hidden="true">
  <i></i>
  <i class="dot" style="width:6px;height:6px;left:14%;top:22%;"></i>
  <i class="dot" style="width:9px;height:9px;left:78%;top:16%;animation-delay:1.2s;"></i>
  <i class="dot" style="width:5px;height:5px;left:30%;top:78%;animation-delay:2s;"></i>
  <i class="dot" style="width:8px;height:8px;left:86%;top:70%;animation-delay:.6s;"></i>
</div>

<div class="wrap">
  <header class="bar">
    <div class="mini-logo">导</div>
    <span class="site-name">极简导航</span>
  </header>

  <!-- 空态 / 搜索态共用搜索框区域 -->
  <section class="hero" aria-label="搜索区域">
    <div class="brand">
      <div class="logo">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <h1>极简导航</h1>
      <p>输入关键词，全网快速搜索目标网站</p>
    </div>

    <div class="searchbox">
      <svg class="mag" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="搜索网站、工具、服务…" autocomplete="off" spellcheck="false" aria-label="搜索关键词">
      <button class="clear" id="clearBtn" aria-label="清空">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="hints" id="hints">
      <span>热门：</span>
    </div>
  </section>

  <!-- 结果区 -->
  <section class="results" id="results" aria-live="polite">
    <div class="result-meta" id="resultMeta"></div>
    <div class="grid" id="skeleton"></div>
    <div class="grid" id="cards" hidden></div>
    <div class="none" id="none" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg>
      <p>没有找到与 <b id="noneQuery"></b> 相关的网站，换个关键词试试</p>
    </div>
  </section>

  <footer>极简导航 · 高并发骨架屏演示站 &nbsp;|&nbsp; <a href="jump.html?name=开源参考" target="_blank" rel="noopener">设计文档</a></footer>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const input = $("q"), clearBtn = $("clearBtn"), results = $("results");
  const skeletonEl = $("skeleton"), cardsEl = $("cards"), noneEl = $("none");
  const metaEl = $("resultMeta"), hintsEl = $("hints"), noneQuery = $("noneQuery");

  const HOT = ["百度", "翻译", "免费", "网盘", "视频", "AI", "工具"];
  const GRAD = [
    ["#f472b6", "#a855f7"], ["#38bdf8", "#6366f1"], ["#34d399", "#0ea5e9"],
    ["#fbbf24", "#f97316"], ["#a78bfa", "#6d28d9"], ["#fb7185", "#f43f5e"],
    ["#22d3ee", "#3b82f6"], ["#4ade80", "#22c55e"]
  ];
  const SKEL_N = 10;

  let seq = 0, timer = null;

  const hotColor = (s) => {
    let h = 0;
    for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0;
    return GRAD[h % GRAD.length];
  };

  /* 首字母图标 */
  const favIcon = (name) => {
    const [c1, c2] = hotColor(name);
    const ch = Array.from(name)[0] || "?";
    return '<span class="fav" style="background:linear-gradient(135deg,' + c1 + ',' + c2 + ')">' + ch + "</span>";
  };

  const cardHTML = (item) => {
    const tags = (item.tags || []).slice(0, 3).map((t) => "<em>" + escapeHTML(t) + "</em>").join("");
    const url = "jump.html?name=" + encodeURIComponent(item.name) + "&url=" + encodeURIComponent(item.url);
    return '<a class="card" href="' + url + '" target="_blank" rel="noopener">'
      + favIcon(item.name)
      + '<span class="body"><div class="name">' + escapeHTML(item.name) + '</div>'
      + '<div class="desc">' + escapeHTML(item.desc || "") + "</div>"
      + '<span class="tags">' + tags + "</span></span>"
      + '<svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>'
      + "</a>";
  };

  const escapeHTML = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const skeletonHTML = () => '<div class="skel-card"><span class="ic shimmer"></span><span class="ln"><i class="shimmer"></i><i class="shimmer"></i></span></div>'.repeat(SKEL_N);

  const renderSkeleton = () => {
    cardsEl.hidden = true; noneEl.hidden = true;
    skeletonEl.innerHTML = skeletonHTML();
  };

  const setSearching = (on) => {
    document.body.classList.toggle("searching", on);
    clearBtn.style.display = on && input.value ? "flex" : "none";
    results.style.display = on ? "" : "none";
  };

  const doSearch = (kw) => {
    const q = kw.trim();
    if (!q) { reset(); return; }
    setSearching(true);
    const mySeq = ++seq;
    renderSkeleton();
    metaEl.innerHTML = "搜索 <b class=\"query\">" + escapeHTML(q) + "</b> 中…";

    fetch("/api/search?q=" + encodeURIComponent(q))
      .then((r) => r.json())
      .then((data) => {
        if (mySeq !== seq || !document.body.classList.contains("searching")) return;
        const list = data.list || [];
        metaEl.innerHTML = "共 <b>" + list.length + "</b> 条结果 · 关键字 <b class=\"query\">" + escapeHTML(q) + "</b>";
        skeletonEl.innerHTML = "";
        if (!list.length) {
          cardsEl.hidden = true;
          noneQuery.textContent = q;
          noneEl.hidden = false;
        } else {
          noneEl.hidden = true;
          cardsEl.innerHTML = list.map(cardHTML).join("");
          cardsEl.hidden = false;
        }
      })
      .catch(() => {
        if (mySeq !== seq) return;
        skeletonEl.innerHTML = "";
        noneQuery.textContent = q;
        noneEl.hidden = false;
      });
  };

  const reset = () => {
    seq++;
    setSearching(false);
    skeletonEl.innerHTML = ""; cardsEl.innerHTML = ""; metaEl.innerHTML = "";
  };

  const hotEls = HOT.map((k) => {
    const b = document.createElement("button");
    b.textContent = k;
    b.addEventListener("click", () => { input.value = k; doSearch(k); });
    return b;
  });
  hotEls.forEach((b) => hintsEl.appendChild(b));

  input.addEventListener("input", () => {
    clearTimeout(timer);
    clearBtn.style.display = input.value ? "flex" : "none";
    timer = setTimeout(() => doSearch(input.value), 180);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { clearTimeout(timer); doSearch(input.value); }
    if (e.key === "Escape") { input.value = ""; reset(); input.blur(); }
  });
  clearBtn.addEventListener("click", () => { input.value = ""; reset(); input.focus(); });

  setSearching(false);
})();
</script>
</body>
</html>
