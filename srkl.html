        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* 全局全部元素统一使用内嵌字体 */
            font-family: "BirthCustomFont", sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #1a103f, #2c1b69, #512b9c);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
        }

        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            z-index: 10;
            text-align: center;
            padding: 20px;
            animation: fadeIn 2s ease-in-out;
        }

        .title {
            font-size: 4.5rem;
            letter-spacing: 6px;
            text-shadow: 0 0 15px #ffd770, 0 0 30px #ff9f43;
            margin-bottom: 30px;
            animation: glow 2.5s infinite alternate;
        }

        .words {
            font-size: 1.5rem;
            line-height: 2.2;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255,255,255,0.6);
            opacity: 0.9;
        }

        .sub-text {
            margin-top: 40px;
            font-size: 1.2rem;
            opacity: 0.75;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glow {
            from { text-shadow: 0 0 15px #ffd770, 0 0 30px #ff9f43; }
            to { text-shadow: 0 0 22px #ffeb99, 0 0 45px #ffb966; }
        }

        @media(max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            .words {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="container">
    <h1 class="title">生日快乐</h1>
    <p class="words">
        生日快乐，很开心能赶上陪你过生日<br>
        希望往后每一天都开心
    </p>
    <p class="sub-text">愿岁岁无忧，万事皆甜</p>
</div>

<script>
    // 粒子星光动画
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    class Particle {
        constructor() {
            this.x = Math.random() * w;
            this.y = Math.random() * h;
            this.radius = Math.random() * 2 + 0.5;
            this.speedX = Math.random() * 0.8 - 0.4;
            this.speedY = Math.random() * 0.8 - 0.4;
            this.color = `rgba(255, 220, 180, ${Math.random() * 0.6 + 0.2})`;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if(this.x < 0) this.x = w;
            if(this.x > w) this.x = 0;
            if(this.y < 0) this.y = h;
            if(this.y > h) this.y = 0;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
            ctx.fillStyle = this.color;
            ctx.fill();
        }
    }

    let particlesArr = [];
    const count = 120;
    for(let i=0; i<count; i++){
        particlesArr.push(new Particle());
    }

    function animate() {
        ctx.clearRect(0,0,w,h);
        particlesArr.forEach(p=>{
            p.update();
            p.draw();
        })
        requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', ()=>{
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    })
</script>
</body>
</html>
